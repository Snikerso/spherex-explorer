# Wyłącznie lokalne środowisko developerskie, baza dostępna na loopback.
services:
  mongodb:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand({ ping: 1 }).ok === 1 ? quit(0) : quit(1)"]
      interval: 3s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: [bash, /scripts/init-replica.sh]
    volumes:
      - ./scripts/init-replica.sh:/scripts/init-replica.sh:ro
    restart: "no"

volumes:
  mongodb-data:
